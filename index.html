<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1230;--bg2:#1a2a5e;--surf:#16224a;--surf2:#1f2f64;--ink:#eef3ff;--mute:#a9b7dd;--line:#3a4f95;--acc:#7fd35f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#cfe8c6;--bg2:#eaf6e4;--surf:#fff;--surf2:#f1f8ec;--ink:#1d2b1a;--mute:#4f6149;--line:#8fb27f;--acc:#2f8a22;color-scheme:light}}
:root[data-theme="light"]{--bg:#cfe8c6;--bg2:#eaf6e4;--surf:#fff;--surf2:#f1f8ec;--ink:#1d2b1a;--mute:#4f6149;--line:#8fb27f;--acc:#2f8a22;color-scheme:light}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font:700 15px/1.4 Nunito,system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,var(--bg2),transparent 55%),var(--bg)}
.w{max-width:720px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
h1{font:700 clamp(20px,5vw,30px) Silkscreen,monospace;margin:0}h1 em{font-style:normal;color:var(--acc)}
h2{font:700 20px Silkscreen,monospace;margin:6px 0 10px}
.hide{display:none!important}
.p{background:var(--surf);border:3px solid var(--line);border-radius:6px;box-shadow:4px 4px 0 rgba(0,0,0,.3);padding:10px}
button{font:800 14px Nunito,sans-serif;padding:9px 12px;border:3px solid var(--line);border-radius:6px;background:var(--surf2);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);border-color:var(--acc);color:#0b1230}
button:disabled{opacity:.45;cursor:default}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.df{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px;background:var(--c);border-color:rgba(0,0,0,.45);color:#fff;box-shadow:5px 5px 0 rgba(0,0,0,.35);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.df.y{color:#2a2000;text-shadow:none}
.df .sq{width:84px;height:84px;background:rgba(255,255,255,.88);border:3px solid rgba(0,0,0,.5);border-radius:6px;display:grid;place-items:center}
.df b{font:700 20px Silkscreen,monospace}.df small{font-weight:700;opacity:.95}
.df em{font-style:normal;margin-top:auto;padding-top:8px;border-top:2px dashed rgba(255,255,255,.55);font-size:13px}
.df.y em{border-color:rgba(0,0,0,.4)}.df i{opacity:.6;font-style:normal}
.hud{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{background:var(--surf);border:2px solid var(--line);border-radius:6px;padding:4px 10px;font-weight:800}
.fear{flex:1 1 130px;min-width:110px;height:30px;border:2px solid var(--line);border-radius:6px;background:var(--surf);overflow:hidden;position:relative}
.fear i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#9b1c1c,#ff4a3a);transition:width .1s}
.fear span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;text-shadow:0 1px 2px #000;color:#fff}
.cw{position:relative}
canvas{width:100%;height:auto;display:block;border:4px solid var(--line);border-radius:6px;background:#5aa646;touch-action:manipulation;box-shadow:4px 4px 0 rgba(0,0,0,.3)}
#end{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:rgba(5,8,25,.78);border-radius:6px;text-align:center;padding:16px}
#end b{font:700 clamp(22px,6vw,34px) Silkscreen,monospace}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:10px}
#shop button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:12px}
#shop button small{color:var(--mute);font-weight:700}#shop button.on small{color:#0b1230}
#msg,#lm{min-height:24px;margin-top:10px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.cu{border:2px solid var(--line);border-radius:6px;padding:8px;background:var(--surf2);font-size:13px}.cu.no{opacity:.35}

  if(G.wave>=10){M.bank+=Math.floor(500*G.d.bm+G.coins);endGame(2,'Победа! Бонус в банк. Загляни в лобби за новыми Верити.')}else{save();say('Волна пройдена: +60 монет, +5 семечек.')}}
 hud()}
function face(u,p2,s){var c=u.x,y=u.y-s*.3;x.fillStyle='#111';x.beginPath();x.arc(c-s*.35,y-s*.2,s*.12,0,7);x.arc(c+s*.35,y-s*.2,s*.12,0,7);x.fill();x.strokeStyle='#111';x.lineWidth=2;x.beginPath();
 if(p2){x.moveTo(c-s*.5,y+s*.35);x.lineTo(c-s*.25,y+s*.15);x.lineTo(c,y+s*.35);x.lineTo(c+s*.25,y+s*.15);x.lineTo(c+s*.5,y+s*.35)}else x.arc(c,y+s*.05,s*.45,.2,2.9);x.stroke()}
function draw(){for(var i=0;i<16;i++)for(var j=0;j<10;j++){x.fillStyle=(i+j)%2?'#5aa646':'#63b04e';x.fillRect(i*C,j*C,C,C)}
 x.lineCap='square';x.lineJoin='miter';[[C-2,'#5b3b1f'],[C-8,'#9b6b3e']].forEach(function(s){x.strokeStyle=s[1];x.lineWidth=s[0];x.beginPath();PT.forEach(function(p,i){i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])});x.stroke()});
 G.units.forEach(function(u){var t=TY[u.k],p2=G.p2&&G.cool<=0;x.fillStyle='rgba(0,0,0,.25)';x.fillRect(u.cx*C+4,u.cy*C+34,C-8,4);x.fillStyle='#6b4a2b';x.fillRect(u.cx*C+4,u.cy*C+22,C-8,14);x.fillStyle='#4aa83a';x.fillRect(u.cx*C+4,u.cy*C+20,C-8,6);
  var im=IM[u.k+(p2?2:1)];if(im&&im.complete&&im.naturalWidth){x.globalAlpha=G.cool>0||u.po?.45:1;x.drawImage(im,u.x-18,u.y-26,36,36);x.globalAlpha=1;x.strokeStyle=p2?'#c4161c':'#111';x.lineWidth=2;x.beginPath();x.arc(u.x,u.y-8,18,0,7);x.stroke()}else{x.fillStyle=G.cool>0?'#777':(p2?'#c4161c':t.col);x.beginPath();x.arc(u.x,u.y-4,15,0,7);x.fill();x.strokeStyle='#111';x.lineWidth=2;x.stroke();face(u,p2,26)}
  if(u.k=='pumpkinity'){x.fillStyle='#2b7a2b';x.fillRect(u.x-2,u.y-24,4,6)}});
 G.shots.forEach(function(s){x.strokeStyle=s.col;x.lineWidth=3;x.beginPath();x.moveTo(s.a,s.b-4);x.lineTo(s.c,s.e);x.stroke()});
 G.en.forEach(function(e){var p=pos(e.d),T=ET[e.ty],r=e.boss?26:T.r;x.globalAlpha=inv(e)?.3:1;x.fillStyle=e.po?'#6a1fc2':e.boss?G.d.boss.col:(e.burn>0?'#7a2a1a':T.c);x.beginPath();x.arc(p[0],p[1],r,0,7);x.fill();x.strokeStyle='#111';x.lineWidth=2;x.stroke();
  x.fillStyle='#fff';x.fillRect(p[0]-r*.5,p[1]-r*.25,r*.25,r*.25);x.fillRect(p[0]+r*.25,p[1]-r*.25,r*.25,r*.25);
  if(e.boss){x.fillStyle='#ffd21f';x.fillRect(p[0]-14,p[1]-r-10,28,8)}
  x.fillStyle='#000';x.fillRect(p[0]-r,p[1]-r-8,r*2,4);x.fillStyle=e.po?'#c08cff':e.boss?'#ff5a5a':'#4cd04c';x.fillRect(p[0]-r,p[1]-r-8,r*2*Math.max(0,e.hp/e.max),4);x.globalAlpha=1});
 if(G.p2&&G.cool<=0){x.fillStyle='rgba(180,0,0,.14)';x.fillRect(0,0,640,400)}}
function lobby(){$('bk').textContent=Math.floor(M.bank);$('bs').textContent=M.seeds;var h='';for(var k in TY)h+='<div class="cu'+(M.own[k]?'':' no')+'">'+pic(k,1,40)+pic(k,2,40)+'<br><b>'+TY[k].n+'</b><br>'+RA[k]+'<br>'+TY[k].d+'</div>';$('col').innerHTML=h}
function opn(c){var r=Math.random(),pool,k;
 if(c==1){if(M.bank<400)return lm('Не хватает монет.');M.bank-=400;pool=r<.55?['moggity','sadity','lovity']:r<.88?['cruelity','falsity']:['galaxity','demonity']}
 else{if(M.seeds<60)return lm('Нужно 60 семечек.');M.seeds-=60;pool=r<.2?['pumpkinity']:r<.6?['cruelity','falsity','sadity']:['moggity','lovity','galaxity','demonity']}
 k=pool[Math.floor(Math.random()*pool.length)];
 if(M.own[k]){M.bank+=120;lm('Дубликат: '+TY[k].n+'. Вернули 120 монет.')}else{M.own[k]=1;lm('Новый Верити: '+TY[k].n+' ('+RA[k]+')!')}
 save();lobby()}
$('lb').onclick=function(){if(cur!='lobby'){lm('Монеты копятся в банк за волны и победу.');scr('lobby')}};
$('back').onclick=function(){if(prev=='game'&&G){scr('game');shop()}else{menu();scr('menu')}};
$('c1').onclick=function(){opn(1)};$('c2').onclick=function(){opn(2)};
$('ex').onclick=function(){var c=btoa(JSON.stringify(M));try{navigator.clipboard.writeText(c);lm('Код скопирован. Сохрани его в заметках.')}catch(e){prompt('Скопируй код сохранения',c)}};
$('im').onclick=function(){var c=prompt('Вставь код сохранения');if(!c)return;try{var o=JSON.parse(atob(c.trim()));if(!o||!o.own)throw 0;M=o;save();lobby();lm('Сохранение загружено.')}catch(e){lm('Код не подошёл.')}};
addEventListener('pagehide',save);document.addEventListener('visibilitychange',save);try{navigator.storage.persist()}catch(e){}
$('e1').onclick=function(){menu();scr('menu')};$('e2').onclick=function(){lm('Монеты копятся в банк за волны и победу.');scr('lobby')};
var last=0;function loop(t){var dt=Math.min(.05,(t-last)/1000||0);last=t;if(G&&cur=='game'){if(!G.over)for(var i=0;i<G.spd;i++)upd(dt);draw()}requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
