body{margin:0;min-height:100vh;color:var(--ink);font:700 15px/1.4 Nunito,system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,var(--bg2),transparent 55%),var(--bg)}
.w{max-width:720px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
h1{font:700 clamp(20px,5vw,30px) Silkscreen,monospace;margin:0}h1 em{font-style:normal;color:var(--acc)}
h2{font:700 20px Silkscreen,monospace;margin:6px 0 10px}
.hide{display:none!important}
.p{background:var(--surf);border:3px solid var(--line);border-radius:6px;box-shadow:4px 4px 0 rgba(0,0,0,.3);padding:10px}
button{font:800 14px Nunito,sans-serif;padding:9px 12px;border:3px solid var(--line);border-radius:6px;background:var(--surf2);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);border-color:var(--acc);color:#0b1230}
button:disabled{opacity:.45;cursor:default}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.df{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px;background:var(--c);border-color:rgba(0,0,0,.45);color:#fff;box-shadow:5px 5px 0 rgba(0,0,0,.35);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.df.y{color:#2a2000;text-shadow:none}

.df.y em{border-color:rgba(0,0,0,.4)}.df i{opacity:.6;font-style:normal}
.hud{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}

.fear{flex:1 1 130px;min-width:110px;height:30px;border:2px solid var(--line);border-radius:6px;background:var(--surf);overflow:hidden;position:relative}
.fear i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#9b1c1c,#ff4a3a);transition:width .1s}
.fear span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;text-shadow:0 1px 2px #000;color:#fff}
.cw{position:relative}
canvas{width:100%;height:auto;display:block;border:4px solid var(--line);border-radius:6px;background:#5aa646;touch-action:manipulation;box-shadow:4px 4px 0 rgba(0,0,0,.3)}

.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

{id:'lord',n:'Выбей Lord Verity',a:'Верный Лорду',s:200,c:1500,v:1200},
{id:'open5',n:'Открой 5 ящиков Верити',a:'Любитель ящиков',s:20,c:200,v:100},
{id:'own6',n:'Собери 6 разных Верити',a:'Коллекционер',s:40,c:300,v:200},
{id:'promo',n:'Активируй любой промокод',a:'Знаток кодов',s:10,c:100,v:50}];
function chk(){var d=M.done;if(M.own.demonity)d.demonity=1;if(M.own.galaxity)d.galaxity=1;if(M.own.lord)d.lord=1;if(M.opens>=5)d.open5=1;if(Object.keys(M.own).length>=6)d.own6=1;if(Object.keys(M.promos).length)d.promo=1}
function tasks(){chk();$('tb').textContent=Math.floor(M.bank);$('ts').textContent=M.seeds;var h='';
 TK.forEach(function(t){var dn=M.done[t.id],cl=M.claimed[t.id],bt='';
  if(dn&&!cl)bt='<button data-c="'+t.id+'">Забрать</button>';else if(cl&&M.inv[t.id])bt='<button data-s="'+t.id+'">Продать ачивку +'+t.v+' 🪙</button>';else if(cl)bt='<i>Ачивка продана</i>';
  h+='<div class="cu tk'+(dn?'':' no')+'"><b>'+(dn?'✅ ':'⬜ ')+t.n+'</b>Награда: '+t.s+' 🎃, '+t.c+' 🪙<br>Ачивка: «'+t.a+'»<br>'+bt+'</div>'});
 $('tl').innerHTML=h}
$('tl').onclick=function(e){var b=e.target.closest('button');if(!b)return;var id=b.dataset.c||b.dataset.s,t=TK.filter(function(x){return x.id==id})[0];
 if(b.dataset.c&&M.done[id]&&!M.claimed[id]){M.seeds+=t.s;M.bank+=t.c;M.claimed[id]=1;M.inv[id]=1}else if(b.dataset.s&&M.inv[id]){M.bank+=t.v;delete M.inv[id]}save();tasks()};
var PC={VERITYTD:[50,300],HALLOWENUPDATESOON:[100,200],'NEWUPDATE1.4':[80,500],TRADES:[60,250]};
function pmm(t){$('pmm').textContent=t}
$('pb').onclick=function(){var c=$('pi').value.toUpperCase().replace(/\s+/g,''),r=PC.hasOwnProperty(c)?PC[c]:0;if(!r)return pmm('Такого промокода нет.');if(M.promos[c])return pmm('Промокод уже использован.');M.promos[c]=1;M.seeds+=r[0];M.bank+=r[1];save();pmm('Готово! +'+r[0]+' 🎃 и +'+r[1]+' 🪙');$('pi').value=''};
$('tk').onclick=function(){scr('tasks')};$('pmb').onclick=function(){scr('promo')};
$('hid').onclick=function(){lm('Ты нашёл секрет! Промокод: VERITYTD')};
function opn(c){var r=Math.random(),pool,k;
 if(c==1){if(M.bank<400)return lm('Не хватает монет.');M.bank-=400;pool=r<.55?['moggity','sadity','lovity']:r<.88?['cruelity','falsity']:['galaxity','demonity']}
 else{if(M.seeds<60)return lm('Нужно 60 семечек.');M.seeds-=60;pool=r<.2?['pumpkinity']:r<.6?['cruelity','falsity','sadity']:['moggity','lovity','galaxity','demonity']}
 if(c==1){M.opens++;if(!M.own.lord&&M.done.hard&&M.opens>=8&&(Math.random()<.015||M.opens>=60))pool=['lord']}
 k=pool[Math.floor(Math.random()*pool.length)];
 if(M.own[k]){M.bank+=120;lm('Дубликат: '+TY[k].n+'. Вернули 120 монет.')}else{M.own[k]=1;lm('Новый Верити: '+TY[k].n+' ('+RA[k]+')!')}
 save();lobby()}
$('lb').onclick=function(){if(cur!='lobby'){lm('Монеты копятся в банк за волны и победу.');scr('lobby')}};
$('back').onclick=function(){if(prev=='game'&&G){scr('game');shop()}else{menu();scr('menu')}};
[].forEach.call(document.querySelectorAll('.bk'),function(b){b.onclick=$('back').onclick});
$('c1').onclick=function(){opn(1)};$('c2').onclick=function(){opn(2)};
$('ex').onclick=function(){var c=btoa(JSON.stringify(M));try{navigator.clipboard.writeText(c);lm('Код скопирован. Сохрани его в заметках.')}catch(e){prompt('Скопируй код сохранения',c)}};
$('im').onclick=function(){var c=prompt('Вставь код сохранения');if(!c)return;try{var o=JSON.parse(atob(c.trim()));if(!o||!o.own)throw 0;M=o;fix();save();lobby();lm('Сохранение загружено.')}catch(e){lm('Код не подошёл.')}};
addEventListener('pagehide',save);document.addEventListener('visibilitychange',save);try{navigator.storage.persist()}catch(e){}
$('e1').onclick=function(){menu();scr('menu')};$('e2').onclick=function(){lm('Монеты копятся в банк за волны и победу.');scr('lobby')};
var last=0;function loop(t){var dt=Math.min(.05,(t-last)/1000||0);last=t;if(G&&cur=='game'){if(!G.over)for(var i=0;i<G.spd;i++)upd(dt);draw()}requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
</script></body></html>
