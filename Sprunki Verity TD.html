</div><script>

 $('diffs').innerHTML=h;[].forEach.call($('diffs').children,function(b){b.onclick=function(){start(b.dataset.k)}})}
function start(k){var d=DF[k];G={d:d,coins:d.co,lives:d.lv,wave:0,fear:100,p2:false,cool:0,sel:'verity',units:[],en:[],q:0,sp:0,run:false,shots:[],over:0,boss:false,next:6,spd:1};$('end').className='hide';scr('game');shop();hud();say('Расставляй башни: волны идут сами.')}
function hud(){$('c').textContent=Math.floor(G.coins);$('l').textContent=G.lives;$('w').textContent=G.wave;$('s').textContent=M.seeds;$('f').style.width=G.fear+'%';
 $('ph').textContent='Фаза 2: '+(G.p2?'вкл':'выкл');$('ph').className=G.p2?'on':'';$('sk').disabled=G.run||!!G.over;$('sp').textContent='Скорость ×'+G.spd;

function mk(ty,d){var h=25+G.wave*6;return{d:d,hp:h,max:h,v:60,sl:0,burn:0,vul:0,t:0,ty:ty,boss:0,bt:0}}

function upd(dt){
 if(G.p2){G.fear-=14*dt;if(G.fear<=0){G.fear=0;G.p2=false;G.cool=5;say('Страх кончился, юниты спят 5 секунд.')}}else{G.fear=Math.min(100,G.fear+5*dt)}

 x.lineCap='square';x.lineJoin='miter';[[C-2,'#5b3b1f'],[C-8,'#9b6b3e']].forEach(function(s){x.strokeStyle=s[1];x.lineWidth=s[0];x.beginPath();PT.forEach(function(p,i){i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])});x.stroke()});
 G.units.forEach(function(u){var t=TY[u.k],p2=G.p2&&G.cool<=0;x.fillStyle='rgba(0,0,0,.25)';x.fillRect(u.cx*C+4,u.cy*C+34,C-8,4);x.fillStyle='#6b4a2b';x.fillRect(u.cx*C+4,u.cy*C+22,C-8,14);x.fillStyle='#4aa83a';x.fillRect(u.cx*C+4,u.cy*C+20,C-8,6);
  x.fillStyle=G.cool>0?'#777':(p2?'#c4161c':t.col);x.beginPath();x.arc(u.x,u.y-4,15,0,7);x.fill();x.strokeStyle='#111';x.lineWidth=2;x.stroke();face(u,p2,26);
  if(u.k=='pumpkinity'){x.fillStyle='#2b7a2b';x.fillRect(u.x-2,u.y-24,4,6)}});
 G.shots.forEach(function(s){x.strokeStyle=s.col;x.lineWidth=3;x.beginPath();x.moveTo(s.a,s.b-4);x.lineTo(s.c,s.e);x.stroke()});
 G.en.forEach(function(e){var p=pos(e.d),T=ET[e.ty],r=e.boss?26:T.r;x.globalAlpha=inv(e)?.3:1;x.fillStyle=e.boss?G.d.boss.col:(e.burn>0?'#7a2a1a':T.c);x.beginPath();x.arc(p[0],p[1],r,0,7);x.fill();x.strokeStyle='#111';x.lineWidth=2;x.stroke();
  x.fillStyle='#fff';x.fillRect(p[0]-r*.5,p[1]-r*.25,r*.25,r*.25);x.fillRect(p[0]+r*.25,p[1]-r*.25,r*.25,r*.25);
  if(e.boss){x.fillStyle='#ffd21f';x.fillRect(p[0]-14,p[1]-r-10,28,8)}
  x.fillStyle='#000';x.fillRect(p[0]-r,p[1]-r-8,r*2,4);x.fillStyle=e.boss?'#ff5a5a':'#4cd04c';x.fillRect(p[0]-r,p[1]-r-8,r*2*Math.max(0,e.hp/e.max),4);x.globalAlpha=1});
 if(G.p2&&G.cool<=0){x.fillStyle='rgba(180,0,0,.14)';x.fillRect(0,0,640,400)}}
